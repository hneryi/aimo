# Production stack on the demo VPS. Secrets live in /srv/aimoobot/.env (mode 600), never in the image.
name: aimoobot
services:
  app:
    image: aimoobot:latest
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      PUBLIC_URL: https://${APP_DOMAIN}
      DATA_DIR: data
    volumes:
      - ../data:/app/data
    expose: ["8787"]
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - aimo_caddy_data:/data
      - aimo_caddy_config:/config
    depends_on: [app]
volumes:
  # reuse the certificate storage of the previous deployment so the existing TLS certificate keeps working
  aimo_caddy_data: { external: true }
  aimo_caddy_config: { external: true }
