    <script>
      // A new browser tab starts from the welcome page; "Hop in" there sets the flag. Any query string
      // (for example ?fixture=1 or ?app) opens the app directly.
      try {
        if (location.pathname === '/' && !location.search && !sessionStorage.getItem('aimo.entered')) location.replace('/welcome/');
      } catch (e) { /* storage unavailable: open the app */ }
    </script>
